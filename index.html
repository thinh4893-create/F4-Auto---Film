<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F4 Auto - Quản Lý Dán Film</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thu vien xuat Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-white p-5 rounded-xl shadow-md text-center border-t-4 border-blue-600">
      <h1 class="text-2xl font-bold text-slate-800 uppercase tracking-wide">TIẾN THỊNH AUTO - QUẢN LÝ THI CÔNG</h1>
      <p class="text-gray-500 text-sm mt-1">Hệ thống ghi nhận xe thi công & năng suất nhân viên hàng ngày</p>
    </div>

    <!-- Form Nhập Liệu -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2 flex items-center gap-2">
        <span>📋</span> Nhập Xe Dán Mới
      </h2>
      <form id="carForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Tên/Biển Số Xe</label>
          <input type="text" id="carName" placeholder="VD: Ford Everest - 30H.1234" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Loại Film Dán</label>
          <input type="text" id="filmType" placeholder="VD: 3M Crystalline / Ceramic" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
        </div>

        <!-- Chọn Vị Trí & Tự động tính tiền -->
        <div class="md:col-span-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <label class="block text-sm font-bold text-slate-700 mb-2">Chọn Vị Trí Dán Film & Bảng Giá</label>
          
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 text-sm">
            <label class="flex items-center space-x-2 bg-white p-2 rounded border cursor-pointer hover:bg-blue-50">
              <input type="checkbox" id="pos_full" class="price-checkbox accent-blue-600" value="Full xe">
              <span>Full xe</span>
            </label>

            <label class="flex items-center space-x-2 bg-white p-2 rounded border cursor-pointer hover:bg-blue-50">
              <input type="checkbox" id="pos_lai" class="price-checkbox accent-blue-600" data-price="180000" value="Kính Lái">
              <span>Kính Lái (180k)</span>
            </label>

            <label class="flex items-center space-x-2 bg-white p-2 rounded border cursor-pointer hover:bg-blue-50">
              <input type="checkbox" id="pos_hau" class="price-checkbox accent-blue-600" data-price="50000" value="Kính Hậu">
              <span>Kính Hậu (50k)</span>
            </label>

            <label class="flex items-center space-x-2 bg-white p-2 rounded border cursor-pointer hover:bg-blue-50">
              <input type="checkbox" id="pos_noc" class="price-checkbox accent-blue-600" data-price="50000" value="Nóc">
              <span>Kính Nóc (50k)</span>
            </label>
          </div>

          <!-- Chọn số lượng Sườn -->
          <div class="mt-3 pt-3 border-t border-slate-200 flex flex-wrap items-center gap-3 text-sm">
            <span class="font-semibold text-slate-700">Dán Kính Sườn:</span>
            <select id="suon_count" class="border rounded p-1.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="0">Không dán sườn</option>
              <option value="1">1 Sườn (20k)</option>
              <option value="2">2 Sườn (40k)</option>
              <option value="3">3 Sườn (60k)</option>
              <option value="4">4 Sườn (80k)</option>
            </select>
          </div>

          <!-- Tổng tiền hiển thị -->
          <div class="mt-4 pt-2 flex justify-between items-center text-base font-bold text-blue-700 border-t border-slate-200">
            <span>TỔNG TIỀN DÁN:</span>
            <span id="totalPriceDisplay" class="text-xl">0 VNĐ</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Nhân Viên Phụ Trách</label>
          <input type="text" id="workerName" placeholder="VD: Tuấn, Huy" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Thời Gian Thi Công</label>
          <input type="datetime-local" id="timestamp" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
        </div>

        <div class="md:col-span-2 mt-2">
          <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">
            Lưu Thông Tin Thi Công
          </button>
        </div>
      </form>
    </div>

    <!-- Bảng Hiển Thị Dữ Liệu -->
    <div class="bg-white p-6 rounded-xl shadow-md overflow-hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 pb-2 border-b gap-3">
        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <span>🚗</span> Nhật Ký Thi Công Hàng Ngày
        </h2>
        <button id="exportExcelBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 shadow transition">
          📊 Xuất Báo Cáo Excel
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse min-w-[650px]">
          <thead>
            <tr class="bg-slate-100 text-slate-700 uppercase text-xs">
              <th class="p-3 rounded-l-lg">Thời gian</th>
              <th class="p-3">Thông tin Xe</th>
              <th class="p-3">Loại Film</th>
              <th class="p-3">Vị trí dán</th>
              <th class="p-3">Tổng Tiền</th>
              <th class="p-3 rounded-r-lg">Nhân viên</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-slate-100 text-slate-700">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-400">Đang tải dữ liệu từ máy chủ...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnVSwPC-vyu75Qxfv0BnHGZGLPej9wzSc",
      authDomain: "tienthinh.firebaseapp.com",
      databaseURL: "https://tienthinh-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tienthinh",
      storageBucket: "tienthinh.firebasestorage.app",
      messagingSenderId: "514440756279",
      appId: "1:514440756279:web:859af8b81a54a06083d3b2",
      measurementId: "G-J9YNKNRQN0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let globalDataList = [];

    // Tự động set thời gian hiện tại
    const setPresetTime = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('timestamp').value = now.toISOString().slice(0, 16);
    };
    setPresetTime();

    // Hàm tính tiền & tổng hợp vị trí
    function calculateTotal() {
      let total = 0;
      let selectedPositions = [];

      if (document.getElementById('pos_full').checked) {
        selectedPositions.push("Full xe");
      }

      const checkboxes = document.querySelectorAll('.price-checkbox:checked');
      checkboxes.forEach(cb => {
        if (cb.id !== 'pos_full') {
          selectedPositions.push(cb.value);
          total += parseInt(cb.getAttribute('data-price') || 0);
        }
      });

      const suonCount = parseInt(document.getElementById('suon_count').value);
      if (suonCount > 0) {
        const suonPrice = suonCount * 20000;
        total += suonPrice;
        selectedPositions.push(`${suonCount} sườn`);
      }

      document.getElementById('totalPriceDisplay').innerText = total.toLocaleString('vi-VN') + " VNĐ";
      return { total, positionsText: selectedPositions.length > 0 ? selectedPositions.join(', ') : 'Chưa chọn' };
    }

    // Lắng nghe sự kiện thay đổi chọn vị trí
    document.querySelectorAll('.price-checkbox').forEach(cb => cb.addEventListener('change', calculateTotal));
    document.getElementById('suon_count').addEventListener('change', calculateTotal);

    // Xử lý nút Full xe
    document.getElementById('pos_full').addEventListener('change', function() {
      if (this.checked) {
        document.getElementById('pos_lai').checked = true;
        document.getElementById('pos_hau').checked = true;
        document.getElementById('pos_noc').checked = false;
        document.getElementById('suon_count').value = "4";
      } else {
        document.getElementById('pos_lai').checked = false;
        document.getElementById('pos_hau').checked = false;
        document.getElementById('suon_count').value = "0";
      }
      calculateTotal();
    });

    // Reset Form
    function resetFormFields() {
      document.getElementById('carForm').reset();
      document.querySelectorAll('.price-checkbox').forEach(cb => cb.checked = false);
      document.getElementById('suon_count').value = "0";
      calculateTotal();
      setPresetTime();
    }

    // Lưu thông tin xe
    const carForm = document.getElementById('carForm');
    carForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const calc = calculateTotal();
      if (calc.positionsText === 'Chưa chọn') {
        alert("⚠️ Vui lòng tích chọn ít nhất 1 vị trí dán!");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Đang lưu...";

      try {
        await addDoc(collection(db, "danh_sach_dan_film"), {
          carName: document.getElementById('carName').value.trim(),
          filmType: document.getElementById('filmType').value.trim(),
          position: calc.positionsText,
          totalPrice: calc.total,
          workerName: document.getElementById('workerName').value.trim(),
          timestamp: document.getElementById('timestamp').value,
          createdAt: new Date()
        });

        resetFormFields();
        alert("✅ Đã lưu dữ liệu thành công!");
      } catch (error) {
        alert("❌ Đã có lỗi xảy ra: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Lưu Thông Tin Thi Công";
      }
    });

    // Tải danh sách xe realtime
    const q = query(collection(db, "danh_sach_dan_film"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';
      globalDataList = [];

      if (snapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Chưa có dữ liệu thi công nào.</td></tr>';
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        globalDataList.push(data);
        const displayTime = data.timestamp ? data.timestamp.replace('T', ' ') : 'N/A';
        const formattedPrice = (data.totalPrice || 0).toLocaleString('vi-VN') + " đ";

        const row = `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono text-xs text-slate-500">${displayTime}</td>
            <td class="p-3 font-bold text-slate-800">${data.carName}</td>
            <td class="p-3"><span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded text-xs font-medium">${data.filmType}</span></td>
            <td class="p-3 text-slate-600">${data.position}</td>
            <td class="p-3 font-bold text-emerald-600">${formattedPrice}</td>
            <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">${data.workerName}</span></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    });

    // Xuất file Excel
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
      if (globalDataList.length === 0) {
        alert("Không có dữ liệu để xuất file Excel!");
        return;
      }

      const excelData = globalDataList.map((item, index) => ({
        "STT": index + 1,
        "Thời Gian": item.timestamp ? item.timestamp.replace('T', ' ') : '',
        "Tên/Biển Số Xe": item.carName,
        "Loại Film": item.filmType,
        "Vị Trí Dán": item.position,
        "Tổng Tiền (VNĐ)": item.totalPrice || 0,
        "Nhân Viên Thi Công": item.workerName
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "NhatKyThiCong");
      XLSX.writeFile(workbook, `TienThinhAuto_BaoCao_${new Date().toISOString().slice(0,10)}.xlsx`);
    });
  </script>
</body>
</html>
