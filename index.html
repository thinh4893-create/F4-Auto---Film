<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Xe Dán Mới</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #333; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        
        .box-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .grid-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .option-item { background: white; border: 1px solid #cbd5e1; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .option-item:hover { border-color: #2563eb; }
        
        .total-box { font-size: 18px; font-weight: bold; color: #1e40af; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        
        .btn-primary { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }

        /* Style Cài Đặt Nhân Viên */
        .staff-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-toggle { background: #e2e8f0; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .staff-manage-box { display: none; background: #fff; border: 1px dashed #2563eb; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .staff-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-add { background: #16a34a; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .staff-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .tag .remove-btn { color: #ef4444; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>📋 Nhập Xe Dán Mới</h2>
    
    <div class="form-row">
        <div class="form-group">
            <label>Tên/Biển Số Xe</label>
            <input type="text" placeholder="VD: Ford Everest - 30H.1234">
        </div>
        <div class="form-group">
            <label>Loại Film Dán</label>
            <select>
                <option>-- Chọn loại film --</option>
                <option>3M Crystalline</option>
                <option>Llumar</option>
                <option>Ntech</option>
            </select>
        </div>
    </div>

    <div class="box-section">
        <label>Chọn Vị Trí Dán Film & Giá Độc Lập</label>
        <div class="grid-options">
            <label class="option-item"><input type="checkbox" class="price-check" value="160000"> Full Xe (160k)</label>
            <label class="option-item"><input type="checkbox" class="price-check" value="200000"> Full Xe + Nóc (200k)</label>
            <label class="option-item"><input type="checkbox" class="price-check" value="50000"> Kính Lái (50k)</label>
            <label class="option-item"><input type="checkbox" class="price-check" value="30000"> Hậu (30k)</label>
            <label class="option-item"><input type="checkbox" class="price-check" value="30000"> Nóc (30k)</label>
        </div>
        <div style="margin-top: 15px;">
            <label style="font-weight: normal; font-size: 14px;">
                Kính Sườn (20k / 1 sườn): 
                <select id="suon-select" style="width: auto; display: inline-block; margin-left: 8px;">
                    <option value="0">Không dán sườn</option>
                    <option value="20000">1 sườn (20k)</option>
                    <option value="40000">2 sườn (40k)</option>
                    <option value="60000">3 sườn (60k)</option>
                    <option value="80000">4 sườn (80k)</option>
                </select>
            </label>
        </div>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
        <div class="total-box">
            <span>TỔNG TIỀN DÁN XE NÀY:</span>
            <span id="total-price" style="color: #2563eb;">0 VNĐ</span>
        </div>
    </div>

    <!-- KHU VỰC NHÂN VIÊN (ĐÃ THÊM CÀI ĐẶT THÊM/XÓA) -->
    <div class="box-section">
        <div class="staff-header">
            <label>Chọn Nhân Viên Thi Công (Có thể chọn nhiều người)</label>
            <button class="btn-toggle" onclick="toggleStaffManage()">⚙️ Bật/Tắt Quản lý Nhân viên</button>
        </div>

        <!-- Khung thêm / xóa danh sách -->
        <div class="staff-manage-box" id="staff-manage-box">
            <div class="staff-input-group">
                <input type="text" id="new-staff-name" placeholder="Nhập tên nhân viên mới...">
                <button class="btn-add" onclick="addStaff()">Thêm</button>
            </div>
            <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">Bấm dấu ✖ để xóa nhân viên khỏi danh sách:</div>
            <div class="staff-tags" id="staff-tags"></div>
        </div>

        <!-- Danh sách checkbox chọn nhân viên -->
        <div class="grid-options" id="staff-checkbox-list"></div>
        
        <input type="text" placeholder="Hoặc nhập tên nhân viên khác (phân cách bằng dấu phẩy)..." style="margin-top: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label>Ngày Thi Công</label>
        <input type="date" id="work-date">
    </div>

    <button class="btn-primary">Lưu Thông Tin Thi Công</button>
</div>

<script>
    // 1. Khởi tạo danh sách nhân viên mặc định
    let defaultStaff = ['Thịnh', 'Vũ',];
    
    function getStaffList() {
        let saved = localStorage.getItem('staffList');
        return saved ? JSON.parse(saved) : defaultStaff;
    }

    function renderStaff() {
        let list = getStaffList();
        
        // Render ô Checkbox chọn
        let checkContainer = document.getElementById('staff-checkbox-list');
        checkContainer.innerHTML = list.map(name => `
            <label class="option-item">
                <input type="checkbox" value="${name}"> ${name}
            </label>
        `).join('');

        // Render danh sách Tag để xóa trong mục Cài đặt
        let tagContainer = document.getElementById('staff-tags');
        tagContainer.innerHTML = list.map(name => `
            <span class="tag">${name} <span class="remove-btn" onclick="removeStaff('${name}')">✖</span></span>
        `).join('');
    }

    function toggleStaffManage() {
        let box = document.getElementById('staff-manage-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function addStaff() {
        let input = document.getElementById('new-staff-name');
        let name = input.value.trim();
        if (name) {
            let list = getStaffList();
            if (!list.includes(name)) {
                list.push(name);
                localStorage.setItem('staffList', JSON.stringify(list));
                renderStaff();
            }
            input.value = '';
        }
    }

    function removeStaff(name) {
        let list = getStaffList().filter(item => item !== name);
        localStorage.setItem('staffList', JSON.stringify(list));
        renderStaff();
    }

    // 2. Tính tổng tiền tự động
    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('.price-check:checked').forEach(cb => total += parseInt(cb.value));
        total += parseInt(document.getElementById('suon-select').value);
        document.getElementById('total-price').innerText = total.toLocaleString('vi-VN') + ' VNĐ';
    }

    document.querySelectorAll('.price-check, #suon-select').forEach(el => {
        el.addEventListener('change', calculateTotal);
    });

    // Cài đặt ngày hôm nay làm mặc định
    document.getElementById('work-date').valueAsDate = new Date();

    // Chạy khi tải trang
    renderStaff();
</script>

</body>
</html>
