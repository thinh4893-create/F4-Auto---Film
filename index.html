<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>F4 AUTO - TỔNG HỢP THI CÔNG</title>
  <style>
    /* Hiệu ứng chuyển cảnh mượt cho Form & Dropdowns */
    .fade-switch {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Modal Popup Animation căn giữa màn hình */
    @keyframes modalScaleIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes modalScaleOut {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(0.85); opacity: 0; }
    }
    .animate-modal-in {
      animation: modalScaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-modal-out {
      animation: modalScaleOut 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-3 md:p-8 font-sans relative">

  <!-- MODAL POPUP THÔNG BÁO CĂN GIỮA MÀN HÌNH -->
  <div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none bg-black/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-[#1e293b] p-5 rounded-2xl shadow-xl border border-slate-700/60 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-black text-white uppercase tracking-wider flex items-center gap-2"><span>🚗</span> F4 AUTO</h1>
        <p class="text-cyan-400 text-xs mt-1 font-medium">Quản lý Thi công Film Cách Nhiệt & PPF</p>
      </div>
      <!-- TAB CHUYỂN DỊCH VỤ -->
      <div class="flex bg-[#0f172a] p-1.5 rounded-xl border border-slate-700/60 gap-1">
        <button id="btnTabFilm" onclick="switchServiceTab('FILM')" class="px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider bg-cyan-600 text-white shadow">
          🎬 FILM CÁCH NHIỆT
        </button>
        <button id="btnTabPPF" onclick="switchServiceTab('PPF')" class="px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider text-slate-400 hover:text-white">
          🛡️ DÁN PPF
        </button>
      </div>
    </div>

    <!-- THỐNG KÊ THÁNG -->
    <div class="bg-[#1e293b] text-white p-5 rounded-2xl shadow-xl border border-slate-700/60 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700/60 pb-3">
        <h2 id="summaryTitle" class="text-base font-bold flex items-center gap-2 text-cyan-400 uppercase tracking-wider">
          <span>📊</span> THỐNG KÊ FILM CÁCH NHIỆT
        </h2>
        <div class="flex items-center gap-2">
          <label class="text-xs font-semibold uppercase text-slate-400">Chọn tháng:</label>
          <input type="month" id="monthPicker" class="bg-[#0f172a] text-cyan-300 px-3 py-1.5 rounded-lg text-sm font-bold outline-none border border-slate-700">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 text-center">
        <div class="bg-[#334155]/50 p-3 rounded-xl border border-slate-700/50">
          <p class="text-xs text-slate-400 uppercase font-semibold">Tổng Xe Thi Công</p>
          <p id="monthlyCarCount" class="text-2xl font-black text-white mt-1">0 xe</p>
        </div>
        <div class="bg-[#334155]/50 p-3 rounded-xl border border-slate-700/50">
          <p class="text-xs text-slate-400 uppercase font-semibold">Tổng Doanh Thu</p>
          <p id="monthlyTotalDisplay" class="text-2xl font-black text-amber-400 mt-1">0 VNĐ</p>
        </div>
      </div>

      <div class="bg-[#334155]/50 p-4 rounded-xl border border-slate-700/50 mt-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-3">👷‍♂️ Lương Thợ Nhận Trong Tháng</h3>
        <div id="workerSummaryContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>
    </div>

    <!-- FORM NHẬP -->
    <div class="bg-[#1e293b] p-6 rounded-2xl shadow-xl border border-slate-700/60">
      <h2 id="formTitle" class="text-base font-bold mb-4 text-cyan-400 border-b border-slate-700/60 pb-2 uppercase tracking-wider">
        📋 Nhập Xe Dán Film Mới
      </h2>
      <form id="carForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5">Tên/Biển Số Xe</label>
          <input type="text" id="carName" placeholder="Ví dụ: VF8 - 30K-123.45" required class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 focus:border-cyan-500 outline-none text-white text-sm">
        </div>

        <div class="relative">
          <label id="lblType" class="block text-xs font-bold uppercase text-slate-300 mb-1.5">Loại Film Dán</label>
          <div class="relative overflow-hidden rounded-xl">
            <!-- Dropdown chọn cho Film -->
            <select id="filmTypeSelect" class="fade-switch w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 focus:border-cyan-500 outline-none text-white text-sm font-bold cursor-pointer">
              <option value="3M">3M</option>
              <option value="Ari">Ari</option>
              <option value="Stek">Stek</option>
            </select>
            <!-- Dropdown chọn cho PPF -->
            <select id="ppfTypeSelect" class="fade-switch hidden w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 focus:border-cyan-500 outline-none text-white text-sm font-bold cursor-pointer">
              <option value="Ari">Ari</option>
              <option value="Avery">Avery</option>
              <option value="Stek">Stek</option>
              <option value="3M">3M</option>
            </select>
          </div>
        </div>

        <!-- KHU VỰC CHỌN VỊ TRÍ FILM -->
        <div id="filmPositionContainer" class="fade-switch md:col-span-2 bg-[#334155]/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
          <label class="block text-xs font-bold uppercase text-cyan-400">Chọn Vị Trí Dán Film</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
            <label class="flex items-center space-x-2 bg-[#0f172a] p-2.5 rounded-lg border border-slate-700 cursor-pointer hover:border-cyan-500/50 transition">
              <input type="checkbox" class="price-checkbox accent-cyan-500 w-4 h-4" data-price="160000" value="Full xe">
              <span class="font-medium">Full xe</span>
            </label>
            <label class="flex items-center space-x-2 bg-[#0f172a] p-2.5 rounded-lg border border-slate-700 cursor-pointer hover:border-cyan-500/50 transition">
              <input type="checkbox" class="price-checkbox accent-cyan-500 w-4 h-4" data-price="50000" value="Kính Lái">
              <span class="font-medium">Kính Lái</span>
            </label>
            <label class="flex items-center space-x-2 bg-[#0f172a] p-2.5 rounded-lg border border-slate-700 cursor-pointer hover:border-cyan-500/50 transition">
              <input type="checkbox" class="price-checkbox accent-cyan-500 w-4 h-4" data-price="30000" value="Hậu">
              <span class="font-medium">Hậu</span>
            </label>
          </div>
          <div class="pt-3 border-t border-slate-700/50 grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
            <div class="flex items-center justify-between bg-[#0f172a] p-2.5 rounded-lg border border-slate-700">
              <span class="text-slate-300">Kính Sườn:</span>
              <select id="suon_count" class="bg-[#1e293b] border border-slate-700 rounded-lg p-1 text-white text-xs outline-none">
                <option value="0" data-price="0">Không dán</option>
                <option value="1" data-price="20000">1 Sườn</option>
                <option value="2" data-price="40000">2 Sườn</option>
                <option value="3" data-price="60000">3 Sườn</option>
                <option value="4" data-price="80000">4 Sườn</option>
              </select>
            </div>
            <div class="flex items-center justify-between bg-[#0f172a] p-2.5 rounded-lg border border-slate-700">
              <span class="text-slate-300">Nóc xe:</span>
              <select id="noc_xe" class="bg-[#1e293b] border border-slate-700 rounded-lg p-1 text-white text-xs outline-none">
                <option value="" data-price="0">Không dán</option>
                <option value="1 Nóc" data-price="20000">1 Nóc</option>
                <option value="2 Nóc" data-price="40000">2 Nóc</option>
              </select>
            </div>
          </div>
        </div>

        <!-- TỔNG TIỀN HIỂN THỊ -->
        <div class="md:col-span-2 bg-[#0f172a] p-3.5 rounded-xl border border-slate-700/60 flex justify-between items-center">
          <span class="text-xs uppercase font-bold text-slate-400">TỔNG TIỀN XE:</span>
          <span id="totalPriceDisplay" class="text-xl font-black text-cyan-400">0 VNĐ</span>
        </div>

        <!-- CHỌN KTV & THÊM KTV MỚI -->
        <div class="md:col-span-2 bg-[#334155]/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-bold uppercase text-cyan-400">🛠️ Đội Ngũ Kỹ Thuật Viên Thi Công</label>
            <button type="button" onclick="toggleAddWorkerInput()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-cyan-300 px-2.5 py-1 rounded-lg border border-slate-700 transition font-semibold">
              + Thêm KTV
            </button>
          </div>

          <!-- INPUT Ô NHẬP TÊN KTV MỚI -->
          <div id="addWorkerBox" class="hidden flex gap-2 pt-1 pb-2">
            <input type="text" id="newWorkerName" placeholder="Tên KTV mới..." class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-xs text-white outline-none focus:border-cyan-500 flex-1">
            <button type="button" onclick="addNewWorker()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold uppercase">Lưu</button>
          </div>

          <div id="workerCheckboxContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm"></div>

          <div class="p-3 bg-[#0f172a] border border-cyan-800/40 rounded-xl text-xs space-y-1">
            <div id="splitDetailList" class="text-[11px] text-slate-400 space-y-0.5"></div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5">Ngày Thi Công</label>
          <input type="date" id="timestamp" required class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none focus:border-cyan-500">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5">Ghi Chú</label>
          <textarea id="note" rows="2" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none focus:border-cyan-500" placeholder="Ghi chú thi công..."></textarea>
        </div>

        <div class="md:col-span-2 mt-2">
          <button type="submit" id="submitBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider text-sm shadow-lg transition-all active:scale-[0.99]">
            Lưu Thông Tin Thi Công
          </button>
        </div>
      </form>
    </div>

    <!-- BẢNG NHẬT KÝ -->
    <div class="bg-[#1e293b] p-6 rounded-2xl shadow-xl border border-slate-700/60">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/60">
        <h2 id="logTitle" class="text-base font-bold text-cyan-400 uppercase tracking-wider">🚗 Nhật Ký Thi Công Film</h2>
        <button onclick="fetchSheetData()" class="bg-[#334155] hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 transition">🔄 Làm mới</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse min-w-[650px]">
          <thead>
            <tr class="bg-[#0f172a] text-slate-400 uppercase text-[11px]">
              <th class="p-3">Ngày</th>
              <th class="p-3">Xe</th>
              <th class="p-3">Loại</th>
              <th class="p-3">Vị trí</th>
              <th class="p-3">Tổng Tiền</th>
              <th class="p-3">Thợ</th>
              <th class="p-3">Ghi Chú</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-slate-700/60 text-slate-300"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_FLTz9hh7dCdD7bi2d26HrZi8Cx2GUQeVfEYEHqmq1csuT0wC2ThiCtnaBNqchIvkhw/exec";

    let currentService = 'FILM'; 
    let filmStaff = ['Vũ', 'Tú', 'Tùng', 'Thịnh'];
    let ppfStaff = ['Hậu', 'Hoàng', 'Khánh'];

    let globalDataList = [];

    // HÀM HIỂN THỊ POPUP THÔNG BÁO CĂN GIỮA MÀN HÌNH
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const isSuccess = type === 'success';
      const bgColor = isSuccess ? 'bg-[#1e293b] border-emerald-500/60 text-emerald-300' : 'bg-[#1e293b] border-rose-500/60 text-rose-300';
      const icon = isSuccess ? '✅' : '⚠️';

      container.innerHTML = `
        <div class="bg-[#1e293b] border ${bgColor} p-6 rounded-2xl shadow-2xl flex flex-col items-center text-center gap-3 min-w-[280px] max-w-sm animate-modal-in pointer-events-auto">
          <div class="text-4xl">${icon}</div>
          <p class="font-bold text-base text-white">${message}</p>
        </div>
      `;

      container.classList.remove('pointer-events-none', 'opacity-0');
      container.classList.add('opacity-100');

      setTimeout(() => {
        const popup = container.firstElementChild;
        if (popup) {
          popup.classList.remove('animate-modal-in');
          popup.classList.add('animate-modal-out');
        }
        container.classList.remove('opacity-100');
        container.classList.add('opacity-0');

        setTimeout(() => {
          container.innerHTML = '';
          container.classList.add('pointer-events-none');
        }, 200);
      }, 2000);
    }

    function switchServiceTab(type) {
      currentService = type;
      const isPPF = type === 'PPF';

      document.getElementById('btnTabFilm').className = !isPPF ? "px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider bg-cyan-600 text-white shadow" : "px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider text-slate-400 hover:text-white";
      document.getElementById('btnTabPPF').className = isPPF ? "px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider bg-indigo-600 text-white shadow" : "px-4 py-2 rounded-lg text-xs font-black transition-all duration-300 uppercase tracking-wider text-slate-400 hover:text-white";

      document.getElementById('summaryTitle').className = isPPF ? "text-base font-bold flex items-center gap-2 text-indigo-400 uppercase tracking-wider" : "text-base font-bold flex items-center gap-2 text-cyan-400 uppercase tracking-wider";
      document.getElementById('formTitle').className = isPPF ? "text-base font-bold mb-4 text-indigo-400 border-b border-slate-700/60 pb-2 uppercase tracking-wider" : "text-base font-bold mb-4 text-cyan-400 border-b border-slate-700/60 pb-2 uppercase tracking-wider";
      document.getElementById('logTitle').className = isPPF ? "text-base font-bold text-indigo-400 uppercase tracking-wider" : "text-base font-bold text-cyan-400 uppercase tracking-wider";

      document.getElementById('summaryTitle').innerText = isPPF ? "📊 THỐNG KÊ PPF" : "📊 THỐNG KÊ FILM CÁCH NHIỆT";
      document.getElementById('formTitle').innerText = isPPF ? "📋 Nhập Xe Dán PPF Mới" : "📋 Nhập Xe Dán Film Mới";
      document.getElementById('logTitle').innerText = isPPF ? "🛡️ Nhật Ký Thi Công PPF" : "🚗 Nhật Ký Thi Công Film";
      document.getElementById('lblType').innerText = isPPF ? "Loại PPF" : "Loại Film Dán";

      const filmPos = document.getElementById('filmPositionContainer');
      const filmSelect = document.getElementById('filmTypeSelect');
      const ppfSelect = document.getElementById('ppfTypeSelect');
      const submitBtn = document.getElementById('submitBtn');

      if (isPPF) {
        filmPos.classList.add('hidden');
        filmSelect.classList.add('hidden');
        ppfSelect.classList.remove('hidden');
        submitBtn.className = "w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider text-sm shadow-lg transition-all active:scale-[0.99]";
      } else {
        filmPos.classList.remove('hidden');
        filmSelect.classList.remove('hidden');
        ppfSelect.classList.add('hidden');
        submitBtn.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider text-sm shadow-lg transition-all active:scale-[0.99]";
      }

      document.getElementById('addWorkerBox').classList.add('hidden');
      renderStaffUI();
      calculateTotal();
      fetchSheetData();
    }

    function toggleAddWorkerInput() {
      const box = document.getElementById('addWorkerBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        document.getElementById('newWorkerName').focus();
      }
    }

    function addNewWorker() {
      const input = document.getElementById('newWorkerName');
      const name = input.value.trim();
      if (!name) return;

      const activeStaff = currentService === 'PPF' ? ppfStaff : filmStaff;
      if (!activeStaff.includes(name)) {
        activeStaff.push(name);
        renderStaffUI();
        input.value = '';
        document.getElementById('addWorkerBox').classList.add('hidden');
        showToast(`Đã thêm KTV: ${name}`);
      } else {
        showToast("Tên KTV này đã tồn tại!", "error");
      }
    }

    function renderStaffUI() {
      const activeStaff = currentService === 'PPF' ? ppfStaff : filmStaff;
      const checkboxContainer = document.getElementById('workerCheckboxContainer');
      const activeColor = currentService === 'PPF' ? 'accent-indigo-500 hover:border-indigo-500/50' : 'accent-cyan-500 hover:border-cyan-500/50';

      checkboxContainer.innerHTML = activeStaff.map(name => `
        <label class="flex items-center space-x-2.5 bg-[#0f172a] p-3 rounded-xl border border-slate-700 cursor-pointer ${activeColor} transition">
          <input type="checkbox" value="${name}" class="worker-checkbox ${currentService === 'PPF' ? 'accent-indigo-500' : 'accent-cyan-500'} w-4 h-4">
          <span class="font-bold text-slate-200 text-sm">${name} ${name === 'Khánh' ? '<span class="text-[10px] text-amber-400">(Hỗ trợ 50k)</span>' : ''}</span>
        </label>
      `).join('');

      document.querySelectorAll('.worker-checkbox').forEach(cb => cb.addEventListener('change', calculateTotal));
    }

    function getSelectedWorkers() {
      let workers = [];
      document.querySelectorAll('.worker-checkbox:checked').forEach(cb => workers.push(cb.value));
      return workers;
    }

    function calculateWorkerSplits(total, workers) {
      if (workers.length === 0 || total === 0) return {};
      const setWorkers = new Set(workers);
      let breakdown = {};

      if (currentService === 'PPF') {
        const hasKhanh = setWorkers.has('Khánh');
        const khanhFee = hasKhanh ? 50000 : 0;
        if (hasKhanh) breakdown['Khánh'] = khanhFee;

        const remain = Math.max(0, total - khanhFee);
        let mainList = workers.filter(w => w !== 'Khánh');

        if (mainList.length > 0) {
          const splitAmt = Math.round(remain / mainList.length);
          mainList.forEach(w => breakdown[w] = splitAmt);
        }
      } else {
        let shares = {};
        if (workers.length === 4 && setWorkers.has('Vũ') && setWorkers.has('Thịnh') && setWorkers.has('Tú') && setWorkers.has('Tùng')) {
          shares = { 'Vũ': 0.35, 'Thịnh': 0.35, 'Tú': 0.15, 'Tùng': 0.15 };
        } else if (workers.length === 2 && setWorkers.has('Vũ') && setWorkers.has('Thịnh')) {
          shares = { 'Vũ': 0.50, 'Thịnh': 0.50 };
        } else if (workers.length === 3 && (setWorkers.has('Vũ') || setWorkers.has('Thịnh')) && setWorkers.has('Tú') && setWorkers.has('Tùng')) {
          const mainWorker = setWorkers.has('Vũ') ? 'Vũ' : 'Thịnh';
          shares = { [mainWorker]: 0.60, 'Tú': 0.20, 'Tùng': 0.20 };
        } else if (workers.length === 2 && (setWorkers.has('Vũ') || setWorkers.has('Thịnh')) && (setWorkers.has('Tú') || setWorkers.has('Tùng'))) {
          const mainWorker = setWorkers.has('Vũ') ? 'Vũ' : 'Thịnh';
          const subWorker = setWorkers.has('Tú') ? 'Tú' : 'Tùng';
          shares = { [mainWorker]: 0.70, [subWorker]: 0.30 };
        } else {
          const equal = 1 / workers.length;
          workers.forEach(w => shares[w] = equal);
        }
        workers.forEach(w => breakdown[w] = Math.round(total * (shares[w] || 0)));
      }
      return breakdown;
    }

    function calculateTotal() {
      let total = 0;
      let posText = "";

      if (currentService === 'PPF') {
        posText = 'Full xe';
        total = 500000;
      } else {
        let selectedPositions = [];
        document.querySelectorAll('.price-checkbox:checked').forEach(cb => {
          selectedPositions.push(cb.value);
          total += parseInt(cb.getAttribute('data-price') || 0);
        });

        const suonSelect = document.getElementById('suon_count');
        if (parseInt(suonSelect.value) > 0) {
          total += parseInt(suonSelect.options[suonSelect.selectedIndex].getAttribute('data-price') || 0);
          selectedPositions.push(`${suonSelect.value} Sườn`);
        }

        const nocSelect = document.getElementById('noc_xe');
        if (nocSelect.value) {
          total += parseInt(nocSelect.options[nocSelect.selectedIndex].getAttribute('data-price') || 0);
          selectedPositions.push(nocSelect.value);
        }
        posText = selectedPositions.join(', ');
      }

      const totalDisplay = document.getElementById('totalPriceDisplay');
      totalDisplay.innerText = total.toLocaleString('vi-VN') + " VNĐ";
      totalDisplay.className = currentService === 'PPF' ? "text-xl font-black text-indigo-400" : "text-xl font-black text-cyan-400";

      const workers = getSelectedWorkers();
      const breakdown = calculateWorkerSplits(total, workers);

      const splitDetailList = document.getElementById('splitDetailList');
      if (workers.length > 0) {
        splitDetailList.innerHTML = Object.keys(breakdown).map(w => `
          <div class="flex justify-between">
            <span>${w}:</span>
            <span class="font-bold text-amber-400">${breakdown[w].toLocaleString('vi-VN')} VNĐ</span>
          </div>
        `).join('');
      } else {
        splitDetailList.innerHTML = '<span class="text-slate-500">Chưa chọn thợ</span>';
      }

      return { total, posText, workers, breakdown };
    }

    document.querySelectorAll('.price-checkbox').forEach(cb => cb.addEventListener('change', calculateTotal));
    document.getElementById('suon_count').addEventListener('change', calculateTotal);
    document.getElementById('noc_xe').addEventListener('change', calculateTotal);

    const setPresetTime = () => {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      document.getElementById('timestamp').value = `${year}-${month}-${day}`;
      document.getElementById('monthPicker').value = `${year}-${month}`;
    };
    setPresetTime();

    function fetchSheetData() {
      if (!GOOGLE_SCRIPT_URL) return;
      const selectedMonth = document.getElementById('monthPicker').value;
      if (!selectedMonth) return;

      let parts = selectedMonth.split('-');
      let prefix = currentService === 'PPF' ? 'PPF ' : 'Film ';
      let sheetParam = `?sheet=${encodeURIComponent(prefix + parts[1] + '/' + parts[0])}`;

      fetch(GOOGLE_SCRIPT_URL + sheetParam)
        .then(res => res.json())
        .then(data => {
          globalDataList = data.reverse();
          renderTable();
          calculateMonthlyTotal();
        })
        .catch(err => console.error(err));
    }

    function calculateMonthlyTotal() {
      const activeStaff = currentService === 'PPF' ? ppfStaff : filmStaff;
      let grandTotal = 0;
      let carCount = 0;
      let workerMap = {};
      activeStaff.forEach(w => workerMap[w] = 0);

      globalDataList.forEach(item => {
        const itemTotal = Number(item.totalPrice) || 0;
        grandTotal += itemTotal;
        carCount++;

        const workersArray = item.workerName ? item.workerName.split(',').map(w => w.trim()).filter(Boolean) : [];
        if (workersArray.length > 0) {
          const splits = calculateWorkerSplits(itemTotal, workersArray);
          Object.keys(splits).forEach(w => {
            if (workerMap[w] !== undefined) workerMap[w] += splits[w];
            else workerMap[w] = (workerMap[w] || 0) + splits[w];
          });
        }
      });

      document.getElementById('monthlyCarCount').innerText = `${carCount} xe`;
      document.getElementById('monthlyTotalDisplay').innerText = grandTotal.toLocaleString('vi-VN') + " VNĐ";

      const allWorkersToDisplay = Array.from(new Set([...activeStaff, ...Object.keys(workerMap)]));
      const textColor = currentService === 'PPF' ? 'text-indigo-400' : 'text-cyan-400';

      document.getElementById('workerSummaryContainer').innerHTML = allWorkersToDisplay.map(name => `
        <div class="bg-[#0f172a] p-3 rounded-xl text-center border border-slate-700/60">
          <p class="text-xs font-extrabold ${textColor} uppercase">${name}</p>
          <p class="text-sm font-black text-amber-400 mt-1">${(workerMap[name] || 0).toLocaleString('vi-VN')} đ</p>
        </div>
      `).join('');
    }

    function renderTable() {
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';

      if (globalDataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-500">Chưa có dữ liệu nào cho tháng này.</td></tr>';
        return;
      }

      const badgeStyle = currentService === 'PPF' ? 'bg-indigo-950 text-indigo-300 border-indigo-800' : 'bg-cyan-950 text-cyan-300 border-cyan-800';

      globalDataList.forEach(item => {
        tbody.innerHTML += `
          <tr class="hover:bg-[#334155]/40 border-b border-slate-700/60 transition">
            <td class="p-3 text-xs text-slate-400 font-semibold">${item.timestamp}</td>
            <td class="p-3 font-bold text-white">${item.carName}</td>
            <td class="p-3"><span class="${badgeStyle} border px-2 py-0.5 rounded text-xs font-semibold">${item.filmType}</span></td>
            <td class="p-3 text-slate-300">${item.position}</td>
            <td class="p-3 font-black text-amber-400">${(Number(item.totalPrice)||0).toLocaleString('vi-VN')} VNĐ</td>
            <td class="p-3"><span class="bg-slate-800 text-slate-200 border border-slate-700 px-2 py-1 rounded-lg text-xs font-bold">${item.workerName}</span></td>
            <td class="p-3 text-xs text-slate-400 italic">${item.note || '-'}</td>
          </tr>
        `;
      });
    }

    document.getElementById('carForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const calc = calculateTotal();

      if (calc.workers.length === 0) {
        showToast("Vui lòng chọn ít nhất 1 thợ thi công!", "error");
        return;
      }

      const selectedFilmType = currentService === 'PPF' 
        ? document.getElementById('ppfTypeSelect').value 
        : document.getElementById('filmTypeSelect').value;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Đang lưu dữ liệu...";

      const newData = {
        serviceType: currentService,
        carName: document.getElementById('carName').value.trim(),
        filmType: selectedFilmType,
        position: calc.posText,
        totalPrice: calc.total,
        workerName: calc.workers.join(', '),
        note: document.getElementById('note').value.trim(),
        timestamp: document.getElementById('timestamp').value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(newData)
      })
      .then(() => {
        showToast("Lưu Thành Công");
        document.getElementById('carForm').reset();
        setPresetTime();
        renderStaffUI();
        calculateTotal();
        setTimeout(fetchSheetData, 1500);
      })
      .catch(err => {
        console.error(err);
        showToast("Lỗi khi lưu dữ liệu. Vui lòng thử lại!", "error");
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Lưu Thông Tin Thi Công";
      });
    });

    document.getElementById('monthPicker').addEventListener('change', fetchSheetData);

    renderStaffUI();
    fetchSheetData();
  </script>
</body>
</html>
