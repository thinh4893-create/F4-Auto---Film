<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F4 Auto - Quản Lý Dán Film</title>

  <!-- Logo Icon trên iPhone / iPad -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202003.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202003.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 font-sans">

  <!-- Tiêu đề trang -->
  <div class="max-w-4xl mx-auto mb-6 text-center">
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">F4 AUTO - QUẢN LÝ DÁN FILM</h1>
    <p class="text-xs md:text-sm text-slate-500 mt-1">Hệ thống ghi nhận và tra cứu thi công</p>
  </div>

  <div class="max-w-4xl mx-auto grid grid-cols-1 gap-6">
    <!-- Bảng dữ liệu -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
        <h2 class="font-bold text-slate-700 text-sm md:text-base">LỊCH SỬ THI CÔNG</h2>
        <button onclick="fetchData()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-semibold transition">
          🔄 Tải lại
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs md:text-sm">
          <thead class="bg-slate-100 text-slate-600 font-semibold uppercase text-[11px] tracking-wider">
            <tr>
              <th class="p-3">THỜI GIAN</th>
              <th class="p-3">TÊN/BIỂN SỐ</th>
              <th class="p-3">LOẠI FILM</th>
              <th class="p-3">VỊ TRÍ</th>
              <th class="p-3">TỔNG TIỀN</th>
              <th class="p-3">NHÂN VIÊN</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-400">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Điền URL Web App từ Google Apps Script của bạn tại đây
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx/exec'; 

    let globalDataList = [];

    // HÀM ĐỊNH DẠNG NGÀY GIỜ CHUẨN VIỆT NAM (Cắt bỏ đuôi .000Z)
    function formatDateVN(timeStr) {
      if (!timeStr) return 'N/A';
      
      let str = String(timeStr).replace('T', ' ').replace('.000Z', '');
      
      if (str.length >= 16) {
        let parts = str.substring(0, 16).split(' ');
        if (parts.length === 2) {
          let dateParts = parts[0].split('-');
          if (dateParts.length === 3) {
            return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]} ${parts[1]}`;
          }
        }
      }
      return str;
    }

    // HÀM HIỂN THỊ BẢNG DỮ LIỆU
    function renderTable() {
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';

      if (globalDataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Chưa có dữ liệu thi công nào.</td></tr>';
        return;
      }

      globalDataList.forEach(item => {
        const displayTime = formatDateVN(item.timestamp);
        const formattedPrice = (Number(item.totalPrice) || 0).toLocaleString('vi-VN') + " đ";

        const row = `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono text-xs text-slate-700 font-bold">${displayTime}</td>
            <td class="p-3 font-bold text-slate-800">${item.carName}</td>
            <td class="p-3"><span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded text-xs font-semibold">${item.filmType}</span></td>
            <td class="p-3 text-slate-600">${item.position}</td>
            <td class="p-3 font-bold text-emerald-600">${formattedPrice}</td>
            <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">${item.workerName}</span></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    // Tải dữ liệu từ Google Sheets
    function fetchData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          globalDataList = data;
          renderTable();
        })
        .catch(err => console.error(err));
    }

    // Chạy khi mở trang
    window.onload = fetchData;
  </script>
</body>
</html>
